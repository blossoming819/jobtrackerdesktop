server:
  port: 8080

spring:
  application:
    name: job-tracker
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/job_tracker?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: your-local-mysql-password
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

job-tracker:
  storage:
    resume-dir: ./data/resumes
    note-dir: ./data/interview_notes
    general-note-dir: ./data/notes

applymate:
  llm:
    # YAML selects providers/models and routing only. Never place a raw API key here.
    circuit-breaker:
      failure-threshold: 3
      open-duration-seconds: 60
    providers:
      qwen:
        enabled: true
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${APPLYMATE_QWEN_API_KEY:}
        model: qwen-plus
        capabilities:
          structured-output: true
          vision-input: false
          json-schema: false
          streaming: true
      deepseek:
        enabled: true
        base-url: https://api.deepseek.com
        api-key: ${APPLYMATE_DEEPSEEK_API_KEY:}
        model: deepseek-chat
        capabilities:
          structured-output: true
          vision-input: false
          json-schema: false
          streaming: true
    routes:
      resume-parse:
        candidates: [qwen, deepseek]
      low-confidence-field-match:
        candidates: [qwen, deepseek]
      resume-vision:
        candidates: [] # Configure only providers with vision-input: true.
