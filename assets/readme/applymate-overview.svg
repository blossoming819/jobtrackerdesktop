<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">ApplyMate 受控填写流程</title>
  <desc id="desc">ApplyMate 使用本次授权的个人档案和指定简历版本，完成页面扫描、字段匹配、填写方案、人工确认与辅助填写。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8f9ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="420" y1="80" x2="760" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#22315f" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="460" rx="30" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="72" y="60" fill="#26304a" font-family="Georgia,'Noto Serif SC','Songti SC',serif" font-size="38" font-weight="700" letter-spacing="-.65">ApplyMate</text>
    <text x="72" y="94" fill="#66708a" font-size="20">受控的招聘页面填写助手</text>
    <g transform="translate(430 84)" filter="url(#shadow)">
      <rect width="340" height="292" rx="28" fill="url(#panel)" stroke="#d9def8"/>
      <image href="data:image/png;base64," x="32" y="28" width="64" height="64"/>
      <text x="112" y="58" fill="#4f61ca" font-family="Georgia,'Noto Serif SC','Songti SC',serif" font-size="25" font-weight="700" letter-spacing="-.25">ApplyMate</text>
      <text x="112" y="86" fill="#6e7896" font-size="18">填写方案 · 第 1 / 2 步</text>
      <rect x="32" y="122" width="276" height="46" rx="13" fill="#ffffff" stroke="#dde3f7"/>
      <text x="52" y="151" fill="#59657a" font-size="18" font-weight="600">页面扫描</text>
      <text x="292" y="151" text-anchor="end" fill="#5368dc" font-size="18">已完成</text>
      <rect x="32" y="184" width="276" height="46" rx="13" fill="#ffffff" stroke="#dde3f7"/>
      <text x="52" y="213" fill="#59657a" font-size="18" font-weight="600">字段匹配</text>
      <text x="292" y="213" text-anchor="end" fill="#5368dc" font-size="18">待确认</text>
      <rect x="32" y="246" width="276" height="46" rx="13" fill="#5368dc"/>
      <text x="170" y="275" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">确认填写方案</text>
    </g>
    <g fill="#ffffff" stroke="#dfe4f3" stroke-width="1.3">
      <rect x="72" y="145" width="255" height="78" rx="18"/>
      <rect x="72" y="255" width="255" height="78" rx="18"/>
      <rect x="872" y="145" width="255" height="78" rx="18"/>
      <rect x="872" y="255" width="255" height="78" rx="18"/>
    </g>
    <g fill="#2f3a55" font-size="20" font-weight="700">
      <text x="102" y="178">个人档案</text>
      <text x="102" y="288">简历版本</text>
      <text x="902" y="178">辅助填写</text>
      <text x="902" y="288">回到 JobTracker</text>
    </g>
    <g fill="#717d95" font-size="18">
      <text x="102" y="204">本次授权字段</text>
      <text x="102" y="314">指定版本内容</text>
      <text x="902" y="204">确认后写入页面</text>
      <text x="902" y="314">手动更新投递进度</text>
    </g>
    <path d="M327 184C366 184 388 168 430 168" fill="none" stroke="#9aa7d6" stroke-width="3" stroke-linecap="round"/>
    <path d="M327 294C366 294 388 324 430 324" fill="none" stroke="#9aa7d6" stroke-width="3" stroke-linecap="round"/>
    <path d="M770 168C812 168 833 184 872 184" fill="none" stroke="#9aa7d6" stroke-width="3" stroke-linecap="round"/>
    <path d="M770 324C812 324 833 294 872 294" fill="none" stroke="#9a806d" stroke-width="3" stroke-linecap="round"/>
    <rect x="176" y="393" width="848" height="40" rx="20" fill="#ffffff" stroke="#dfe4f3"/>
    <text x="600" y="419" text-anchor="middle" fill="#59657a" font-size="19" font-weight="600">理解页面 → 字段匹配 → 填写方案 → 人工确认 → 辅助填写</text>
  </g>
</svg>
