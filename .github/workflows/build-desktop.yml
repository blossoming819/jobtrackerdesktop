name: Build Windows release artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop/**"
      - "extension/**"
      - "contracts/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  windows:
    name: Windows desktop and ApplyMate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build lite installer
        shell: pwsh
        run: desktop/build-desktop-lite.ps1 -Maven mvn.cmd -Jlink jlink.exe

      - name: Build full installer
        shell: pwsh
        run: desktop/build-desktop-full.ps1 -Maven mvn.cmd -Jlink jlink.exe

      - name: Build ApplyMate extension
        shell: pwsh
        working-directory: extension
        run: |
          npm ci
          npm run build

      - name: Package ApplyMate extension
        shell: pwsh
        run: |
          $version = (Get-Content extension/package.json -Raw | ConvertFrom-Json).version
          $archive = "desktop/release/ApplyMate-$version-chrome-mv3.zip"
          Compress-Archive -Path "extension/.output/chrome-mv3/*" -DestinationPath $archive -Force

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jobtracker-windows-release
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/ApplyMate-*-chrome-mv3.zip
